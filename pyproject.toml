[build-system]
# >=77 for PEP 639 license metadata (`license = "MIT"` + `license-files`),
# which replaces the deprecated `license = { file = ... }` table.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zourcewell"
# Single source of truth for the version. src/zourcewell/__init__.py derives
# __version__ from this file, zourcewell.spec stamps it into the frozen exe,
# and every bump happens here and only here.
version = "0.28"
description = "Unofficial web2api bridge: OpenAI-compatible API over the DeepSeek, Qwen and opencode chat backends, with stable tool_calls for agentic harnesses. Research/educational use only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# From git history (`git log --format="%an <%ae>"`), not invented.
authors = [{ name = "gyatstian", email = "krystianpomni@gmail.com" }]
requires-python = ">=3.11"
keywords = ["openai", "deepseek", "qwen", "web2api", "llm", "proxy", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  # No license classifier: PEP 639 retires it in favour of `license = "MIT"`.
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "curl-cffi>=0.7",
  "wasmtime>=20",
  
  "websocket-client>=1.7",
]

[project.optional-dependencies]
# openai pins the "OpenAI-compatible" claim to the real SDK: tests/test_openai_sdk.py
# drives it against the app over an in-process ASGI transport. 3.33 is the
# version that suite was verified against (it speaks httpx2, its own hard
# dependency).
test = ["pytest>=8", "httpx>=0.27", "openai>=3.33,<4"]
build = ["pyinstaller>=6"]

[project.scripts]
zourcewell = "zourcewell.cli:main"

[project.urls]
Homepage = "https://github.com/gyatstian/zourcewell"
Source = "https://github.com/gyatstian/zourcewell"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from this checkout, never from an installed copy
# (an editable install pointing at another clone silently tests the wrong
# source tree). See tests/conftest.py for the rest of the isolation.
pythonpath = ["src"]
markers = [
  "live: needs real network / real browser / real upstream account (opt in with `pytest -m live`)",
]
# Never express the live tier as addopts - why: tests/AGENTS.md.
filterwarnings = [
  # fastapi's TestClient is built on starlette's httpx shim, which warns about
  # the upcoming httpx2 switch on import. Not actionable from this project.
  "ignore::DeprecationWarning:starlette.*",
]
